services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: taskflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - taskflow_public_assets:/var/www/html/public
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-taskflow}
      DB_USERNAME: ${DB_USERNAME:-taskflow_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow_net

  web:
    image: nginx:1.27-alpine
    container_name: taskflow_web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - taskflow_public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - taskflow_net

  db:
    image: mysql:8.0
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-taskflow}
      MYSQL_USER: ${DB_USERNAME:-taskflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - taskflow_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:33066:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow_net

volumes:
  taskflow_mysql_data:
    driver: local
  taskflow_public_assets:
    driver: local

networks:
  taskflow_net:
    driver: bridge
